[project]
name = "educational-minigpt"
version = "0.1.0"
description = "A small byte-level decoder-only language model for learning PyTorch"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.6,<3", "streamlit>=1.43,<2", "psutil>=6,<9"]

[dependency-groups]
dev = ["pytest>=8,<11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
